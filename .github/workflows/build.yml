name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build qt6-base-dev desktop-file-utils
      - name: Configure and build C++
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Validate installation files
        run: |
          bash -n scripts/install.sh scripts/uninstall.sh
          desktop-file-validate packaging/sleep-scheduler.desktop
          sudo install -D -m 755 build/sleep-scheduler /usr/lib/rtc-sleeper/sleep-scheduler
          sudo install -D -m 755 build/sleep-scheduler-engine /usr/lib/rtc-sleeper/sleep-scheduler-engine
          systemd-analyze verify packaging/sleep-scheduler.service 2>verify.log || { cat verify.log; exit 1; }
      - name: Build binary and source archives
        run: |
          mkdir -p dist/rtc-sleeper/build
          cp build/sleep-scheduler build/sleep-scheduler-engine dist/rtc-sleeper/build/
          cp -a scripts packaging README.md AGENTS.md LICENSE icon.svg dist/rtc-sleeper/
          strip dist/rtc-sleeper/build/sleep-scheduler dist/rtc-sleeper/build/sleep-scheduler-engine
          tar -C dist -czf dist/rtc-sleeper-linux-x86_64.tar.gz rtc-sleeper
          git archive --format=tar.gz --prefix=rtc-sleeper-source/ -o dist/rtc-sleeper-source.tar.gz HEAD
          cd dist
          sha256sum rtc-sleeper-linux-x86_64.tar.gz rtc-sleeper-source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: rtc-sleeper-cpp-linux-${{ github.sha }}
          path: |
            dist/rtc-sleeper-linux-x86_64.tar.gz
            dist/rtc-sleeper-source.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rtc-sleeper-cpp-linux-${{ github.sha }}
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
