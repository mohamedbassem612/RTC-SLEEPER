name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            xvfb desktop-file-utils systemd util-linux

      - name: Compile Python source
        run: python3 -m compileall -q engine.py client.py cli.py gui.py install.py uninstall.py

      - name: Run engine and interface tests
        run: xvfb-run -a python3 -m unittest discover -s tests -v

      - name: Validate desktop entry generated by installer
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          source = Path('install.py').read_text()
          assert 'sleep-scheduler.desktop' in source
          assert 'Exec=/usr/local/bin/sleep-scheduler' in source
          assert 'Categories=Utility;' in source
          ast.parse(source)
          print('Installer desktop entry and syntax verified.')
          PY

      - name: Build distributable archives
        run: |
          mkdir -p dist/stage/rtc-sleeper
          cp -a \
            AGENTS.md README.md LICENSE \
            engine.py client.py cli.py gui.py style.css icon.svg \
            install.py uninstall.py tests \
            dist/stage/rtc-sleeper/
          tar -C dist/stage -czf dist/rtc-sleeper-linux.tar.gz rtc-sleeper
          (cd dist/stage && zip -qr ../rtc-sleeper-linux.zip rtc-sleeper)
          sha256sum dist/rtc-sleeper-linux.tar.gz dist/rtc-sleeper-linux.zip > dist/SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rtc-sleeper-linux-${{ github.sha }}
          path: |
            dist/rtc-sleeper-linux.tar.gz
            dist/rtc-sleeper-linux.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/rtc-sleeper-linux.tar.gz
            dist/rtc-sleeper-linux.zip
            dist/SHA256SUMS
