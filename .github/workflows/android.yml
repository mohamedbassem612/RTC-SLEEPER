name: Android Rust build and release
env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
on:
  push:
    branches: [main]
    tags: ['android-v*']
    paths: ['remote/**', 'android/**', 'scripts/build-android.sh', 'scripts/build-tailnet.sh', '.github/workflows/android.yml', 'tests/test_remote.py']
  pull_request:
    paths: ['remote/**', 'android/**', 'scripts/**', 'tests/test_remote.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.0'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: remote
      - name: Rust validation, pairing and authorization tests
        working-directory: remote
        run: |
          cargo test --locked --workspace --jobs 2
          cargo build --locked -p rtc-sleeper-remote --jobs 2
      - name: Loopback integration, fake scheduler only
        run: python3 -m unittest discover -s tests -p test_remote.py -v
  apk:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: tailnet-go-v1-${{ runner.os }}-1.27.4-ndk28-${{ hashFiles('remote/tailnet/**', 'scripts/build-tailnet.sh') }}
          restore-keys: tailnet-go-v1-${{ runner.os }}-1.27.4-ndk28-
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.0'
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: remote
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'
      - name: Install Android build tools
        run: |
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Prepare private release signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.RTC_ANDROID_KEYSTORE }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/rtc-sleeper.jks"
          chmod 600 "$RUNNER_TEMP/rtc-sleeper.jks"
      - name: Build Rust UI and embedded Tailscale; package signed APK
        if: github.event_name != 'pull_request'
        env:
          RTC_KEYSTORE: ${{ runner.temp }}/rtc-sleeper.jks
          RTC_KEYSTORE_PASSWORD: ${{ secrets.RTC_ANDROID_KEYSTORE_PASSWORD }}
        run: bash scripts/build-android.sh release
      - name: Build debug APK for pull requests
        if: github.event_name == 'pull_request'
        run: bash scripts/build-android.sh debug
      - name: Build Android sandbox regression test
        env:
          RTC_ANDROID_ABIS: x86_64
        run: |
          bash scripts/build-android.sh debug
          android/gradlew -p android --no-daemon :app:assembleDebugAndroidTest
      - name: Start Android 11 emulator and test embedded network startup
        timeout-minutes: 12
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/rtc-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          trap 'cat "$RUNNER_TEMP/rtc-emulator.log" 2>/dev/null || true' ERR
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          "$sdkmanager_path" 'emulator' 'system-images;android-30;default;x86_64'
          avdmanager_path="$(dirname "$sdkmanager_path")/avdmanager"
          echo no | "$avdmanager_path" create avd -n rtc-network-test -k 'system-images;android-30;default;x86_64' -d 'Nexus S'
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd rtc-network-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -feature -Vulkan -memory 2048 -cores 2 >"$RUNNER_TEMP/rtc-emulator.log" 2>&1 &
          emulator_pid=$!
          sleep 5
          kill -0 "$emulator_pid"
          adb_path="$ANDROID_HOME/platform-tools/adb"
          for attempt in $(seq 1 180); do
            if [[ "$("$adb_path" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; then break; fi
            sleep 2
          done
          test "$("$adb_path" shell getprop sys.boot_completed | tr -d '\r')" = 1
          "$adb_path" install -r android/app/build/outputs/apk/debug/app-debug.apk
          "$adb_path" install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          "$adb_path" shell am instrument -w com.mohamedbassem.rtcsleeper.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/rtc-network-test.txt"
          grep -Eq '^OK \(1 test\)' "$RUNNER_TEMP/rtc-network-test.txt"
          "$adb_path" emu kill
      - name: Build desktop companion archive
        run: |
          mkdir -p dist/rtc-sleeper-remote/scripts
          bash scripts/build-tailnet.sh linux dist/rtc-sleeper-remote
          cargo build --locked --manifest-path remote/Cargo.toml -p rtc-sleeper-remote --release --jobs 2
          cp remote/target/release/rtc-sleeper-remote dist/rtc-sleeper-remote/
          cp scripts/install-remote.sh dist/rtc-sleeper-remote/scripts/
          cp -a packaging dist/rtc-sleeper-remote/
          cp docs/ANDROID.md dist/rtc-sleeper-remote/README.md
          tar -C dist -czf dist/rtc-sleeper-remote-linux-x86_64.tar.gz rtc-sleeper-remote
      - name: Collect installable APK and checksums
        run: |
          if [[ '${{ github.event_name }}' == pull_request ]]; then
            cp android/app/build/outputs/apk/debug/*.apk dist/
          else
            cp android/app/build/outputs/apk/release/*.apk dist/
          fi
          cd dist
          sha256sum *.apk *.tar.gz > SHA256SUMS-android
      - uses: actions/upload-artifact@v4
        with:
          name: rtc-sleeper-android-${{ github.sha }}
          path: |
            dist/*.apk
            dist/*.tar.gz
            dist/SHA256SUMS-android
          if-no-files-found: error
      - name: Publish Android release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          name: RTC Sleeper Android (Rust) ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: false
          files: |
            dist/*.apk
            dist/*.tar.gz
            dist/SHA256SUMS-android
    permissions:
      contents: write
