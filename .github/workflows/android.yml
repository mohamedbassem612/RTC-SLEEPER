name: Android APK build and release
env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
on:
  push:
    branches: [main]
    tags: ['android-v*']
    paths: ['remote/**', 'android/**', 'scripts/build-android.sh', 'scripts/build-tailnet.sh', '.github/workflows/android.yml', 'tests/test_remote.py']
  pull_request:
    paths: ['remote/**', 'android/**', 'scripts/**', 'tests/test_remote.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: tailnet-go-v1-${{ runner.os }}-1.27.4-ndk28-${{ hashFiles('remote/tailnet/**', 'scripts/build-tailnet.sh') }}
          restore-keys: tailnet-go-v1-${{ runner.os }}-1.27.4-ndk28-
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.0'
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: remote
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'
      - name: Install Android build tools
        run: |
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Prepare private release signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.RTC_ANDROID_KEYSTORE }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/rtc-sleeper.jks"
          chmod 600 "$RUNNER_TEMP/rtc-sleeper.jks"
      - name: Build Rust UI and embedded Tailscale; package signed APK
        if: github.event_name != 'pull_request'
        env:
          RTC_KEYSTORE: ${{ runner.temp }}/rtc-sleeper.jks
          RTC_KEYSTORE_PASSWORD: ${{ secrets.RTC_ANDROID_KEYSTORE_PASSWORD }}
        run: bash scripts/build-android.sh release
      - name: Build debug APK for pull requests
        if: github.event_name == 'pull_request'
        run: bash scripts/build-android.sh debug
      - name: Collect installable APK
        run: |
          mkdir -p dist/android
          if [[ '${{ github.event_name }}' == pull_request ]]; then
            cp android/app/build/outputs/apk/debug/*.apk dist/android/
          else
            cp android/app/build/outputs/apk/release/*.apk dist/android/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rtc-sleeper-android-apk-${{ github.sha }}
          path: dist/android/*.apk
          if-no-files-found: error
      - name: Publish Android release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          name: RTC Sleeper Android (Rust) ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: false
          files: |
            dist/android/*.apk
    permissions:
      contents: write
