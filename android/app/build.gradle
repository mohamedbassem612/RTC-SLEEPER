plugins { id 'com.android.application' }
android {
    namespace 'com.mohamedbassem.rtcsleeper'
    compileSdk 36
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'com.mohamedbassem.rtcsleeper'
        minSdk 26
        targetSdk 36
        versionCode 101
        versionName '0.1.1'
        ndk { abiFilters.addAll((System.getenv('RTC_ANDROID_ABIS') ?: 'arm64-v8a x86_64').tokenize()) }
    }
    buildFeatures { buildConfig true }
    sourceSets {
        main.jniLibs.srcDirs = []
        debug.jniLibs.srcDirs = ['src/debug/jniLibs']
        release.jniLibs.srcDirs = ['src/release/jniLibs']
    }
    signingConfigs {
        release {
            if (System.getenv('RTC_KEYSTORE')) {
                storeFile file(System.getenv('RTC_KEYSTORE'))
                storePassword System.getenv('RTC_KEYSTORE_PASSWORD')
                keyAlias 'rtc-sleeper'
                keyPassword System.getenv('RTC_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    packaging { jniLibs { useLegacyPackaging true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // CaptureManager uses AndroidX permission helpers, omitted by ZXing's POM.
    implementation 'androidx.core:core:1.13.1'
}
