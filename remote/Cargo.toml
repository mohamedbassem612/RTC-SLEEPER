[workspace]
members = ["core", "desktop", "android"]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0
